[versions]
kotlin = "2.1.20"
agp = "8.10.1"
compose-bom = "2025.05.00"
osmdroid = "6.1.20"
kotlinx-serialization = "1.8.0"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version = "1.16.0" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version = "1.10.1" }
compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "compose-bom" }
compose-ui = { group = "androidx.compose.ui", name = "ui" }
compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
compose-material3 = { group = "androidx.compose.material3", name = "material3" }
compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version = "2.9.0" }
play-services-location = { group = "com.google.android.gms", name = "play-services-location", version = "21.3.0" }
osmdroid-android = { group = "org.osmdroid", name = "osmdroid-android", version.ref = "osmdroid" }
# Serializza lo storico dei giri e legge la risposta di Nominatim. Preferita a org.json,
# che vive in android.jar e negli unit test JVM è uno stub che lancia "Stub!": con quello
# il formato del file su disco resterebbe senza test.
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
# Non usata direttamente: allinea la fragment 1.1.0 che play-services-location tira
# dietro e che il lint della release rifiuta (InvalidFragmentVersionForActivityResult).
androidx-fragment = { group = "androidx.fragment", name = "fragment", version = "1.8.9" }

# Test
junit = { group = "junit", name = "junit", version = "4.13.2" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
# Versione allineata al compilatore Kotlin: il plugin di serializzazione è distribuito
# insieme a lui e disallinearli fa fallire la compilazione.
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
